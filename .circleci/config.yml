version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/openjdk:21.0

  machine-executor:
    machine: true

.executors-matrix: &executors-matrix
  matrix:
    parameters:
      executor: [ "docker-executor", "machine-executor" ]

commands:
  install-java:
    parameters:
      executor:
        type: string
    steps:
      - when:
          condition:
            equal: [ "machine-executor", << parameters.executor >> ]
          steps:
            - run: |
                sudo apt-get update
                sudo apt-get install openjdk-21-jdk
                java -version

  restore-gradle-cache:
    steps:
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-

  save-gradle-cache:
    steps:
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

jobs:

  debug-all-variables:
    executor: docker-executor
    steps:
      - run:
          name: Print CircleCI Environment Variables
          command: |
            echo "=== CIRCLECI ENVIRONMENT VARIABLES ==="
            env | grep -E "^CIRCLE" | sort
      - run:
          name: Print Pipeline Values
          # 	- Unknown variable(s): pipeline.event.github.sender.type, pipeline.event.github.comment.body, pipeline.trigger.received_at, pipeline.event.context.github.pr_url
          command: |
            echo "=== PIPELINE VALUES ==="
            echo "pipeline.id => << pipeline.id >>"
            echo "pipeline.number => << pipeline.number >>"
            echo "pipeline.project.git_url => << pipeline.project.git_url >>"
            echo "pipeline.project.type => << pipeline.project.type >>"
            echo "pipeline.git.tag => << pipeline.git.tag >>"
            echo "pipeline.git.branch => << pipeline.git.branch >>"
            echo "pipeline.git.branch.is_default => << pipeline.git.branch.is_default >>"
            echo "pipeline.git.revision => << pipeline.git.revision >>"
            echo "pipeline.git.base_revision => << pipeline.git.base_revision >>"
            echo "pipeline.git.base_revision => << pipeline.git.base_revision >>"
            echo "pipeline.trigger_source => << pipeline.trigger_source >>"
            echo "pipeline.schedule.name => << pipeline.schedule.name >>"
            echo "pipeline.schedule.id => << pipeline.schedule.id >>"
            echo "pipeline.trigger_parameters.circleci.trigger_type => << pipeline.trigger_parameters.circleci.trigger_type >>"
            echo "pipeline.trigger_parameters.circleci.event_time => << pipeline.trigger_parameters.circleci.event_time >>"
            echo "pipeline.trigger_parameters.circleci.event_type => << pipeline.trigger_parameters.circleci.event_type >>"
            echo "pipeline.trigger_parameters.gitlab.type => << pipeline.trigger_parameters.gitlab.type >>"
            echo "pipeline.trigger_parameters.gitlab.ref => << pipeline.trigger_parameters.gitlab.ref >>"
            echo "pipeline.trigger_parameters.github_app.ref => << pipeline.trigger_parameters.github_app.ref >>"
            echo "pipeline.trigger_parameters.gitlab.checkout_sha => << pipeline.trigger_parameters.gitlab.checkout_sha >>"
            echo "pipeline.trigger_parameters.github_app.checkout_sha => << pipeline.trigger_parameters.github_app.checkout_sha >>"
            echo "pipeline.trigger_parameters.gitlab.user_id => << pipeline.trigger_parameters.gitlab.user_id >>"
            echo "pipeline.trigger_parameters.github_app.user_id => << pipeline.trigger_parameters.github_app.user_id >>"
            echo "pipeline.trigger_parameters.gitlab.user_name => << pipeline.trigger_parameters.gitlab.user_name >>"
            echo "pipeline.trigger_parameters.github_app.user_name => << pipeline.trigger_parameters.github_app.user_name >>"
            echo "pipeline.trigger_parameters.gitlab.user_username => << pipeline.trigger_parameters.gitlab.user_username >>"
            echo "pipeline.trigger_parameters.github_app.user_username => << pipeline.trigger_parameters.github_app.user_username >>"
            echo "pipeline.trigger_parameters.gitlab.user_avatar => << pipeline.trigger_parameters.gitlab.user_avatar >>"
            echo "pipeline.trigger_parameters.github_app.user_avatar => << pipeline.trigger_parameters.github_app.user_avatar >>"
            echo "pipeline.trigger_parameters.gitlab.repo_name => << pipeline.trigger_parameters.gitlab.repo_name >>"
            echo "pipeline.trigger_parameters.github_app.repo_name => << pipeline.trigger_parameters.github_app.repo_name >>"
            echo "pipeline.trigger_parameters.gitlab.repo_url => << pipeline.trigger_parameters.gitlab.repo_url >>"
            echo "pipeline.trigger_parameters.github_app.repo_url => << pipeline.trigger_parameters.github_app.repo_url >>"
            echo "pipeline.trigger_parameters.gitlab.web_url => << pipeline.trigger_parameters.gitlab.web_url >>"
            echo "pipeline.trigger_parameters.github_app.web_url => << pipeline.trigger_parameters.github_app.web_url >>"
            echo "pipeline.trigger_parameters.gitlab.commit_sha => << pipeline.trigger_parameters.gitlab.commit_sha >>"
            echo "pipeline.trigger_parameters.github_app.commit_sha => << pipeline.trigger_parameters.github_app.commit_sha >>"
            echo "pipeline.trigger_parameters.gitlab.commit_title => << pipeline.trigger_parameters.gitlab.commit_title >>"
            echo "pipeline.trigger_parameters.github_app.commit_title => << pipeline.trigger_parameters.github_app.commit_title >>"
            echo "pipeline.trigger_parameters.gitlab.commit_message => << pipeline.trigger_parameters.gitlab.commit_message >>"
            echo "pipeline.trigger_parameters.github_app.commit_message => << pipeline.trigger_parameters.github_app.commit_message >>"
            echo "pipeline.trigger_parameters.gitlab.commit_timestamp => << pipeline.trigger_parameters.gitlab.commit_timestamp >>"
            echo "pipeline.trigger_parameters.github_app.commit_timestamp => << pipeline.trigger_parameters.github_app.commit_timestamp >>"
            echo "pipeline.trigger_parameters.gitlab.commit_author_name => << pipeline.trigger_parameters.gitlab.commit_author_name >>"
            echo "pipeline.trigger_parameters.github_app.commit_author_name => << pipeline.trigger_parameters.github_app.commit_author_name >>"
            echo "pipeline.trigger_parameters.gitlab.commit_author_email => << pipeline.trigger_parameters.gitlab.commit_author_email >>"
            echo "pipeline.trigger_parameters.gitlab.branch => << pipeline.trigger_parameters.gitlab.branch >>"
            echo "pipeline.trigger_parameters.github_app.branch => << pipeline.trigger_parameters.github_app.branch >>"
            echo "pipeline.trigger_parameters.gitlab.default_branch => << pipeline.trigger_parameters.gitlab.default_branch >>"
            echo "pipeline.trigger_parameters.gitlab.x_gitlab_event_id => << pipeline.trigger_parameters.gitlab.x_gitlab_event_id >>"
            echo "pipeline.trigger_parameters.gitlab.is_fork_merge_request => << pipeline.trigger_parameters.gitlab.is_fork_merge_request >>"
            echo "pipeline.trigger_parameters.webhook.body => << pipeline.trigger_parameters.webhook.body >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.action => << pipeline.event.action >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.base.ref => << pipeline.event.github.pull_request.base.ref >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.head.ref => << pipeline.event.github.pull_request.head.ref >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.draft => << pipeline.event.github.pull_request.draft >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.title => << pipeline.event.github.pull_request.title >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.number => << pipeline.event.github.pull_request.number >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.event.github.pull_request.merged => << pipeline.event.github.pull_request.merged >>"
            echo "pipeline.event.name => << pipeline.event.name >>"
            echo "pipeline.deploy.component_name => << pipeline.deploy.component_name >>"
            echo "pipeline.deploy.environment_name => << pipeline.deploy.environment_name >>"
            echo "pipeline.deploy.target_version => << pipeline.deploy.target_version >>"
            echo "pipeline.deploy.current_version => << pipeline.deploy.current_version >>"
            echo "pipeline.deploy.namespace => << pipeline.deploy.namespace >>"
            echo "pipeline.deploy.reason => << pipeline.deploy.reason >>"

  just-checkout:
    parameters:
      checkout-method:
        type: string
        default: full
    executor: machine-executor
    steps:
      - checkout:
          method: << parameters.checkout-method >>

  build:
    parameters:
      executor:
        type: string
    executor: << parameters.executor >>
    steps:
      - checkout
      - install-java:
          executor: << parameters.executor >>
      - restore-gradle-cache
      - run: ./gradlew build -x test
      - save-gradle-cache
      - persist_to_workspace:
          root: .
          paths:
            - build
    retention:
      caches: 1d

  test:
    parameters:
      executor:
        type: string
    executor: << parameters.executor >>
    steps:
      - checkout
      - install-java:
          executor: << parameters.executor >>
      - attach_workspace:
          at: .
      - restore-gradle-cache
      - run: ./gradlew test --rerun
      - store_test_results:
          path: build/test-results
      - save-gradle-cache

  step-rerun:
    executor: docker-executor
    steps:
      - checkout
      - restore-gradle-cache
      - run:
          command: ./gradlew run --args="stepRerun"
          max_auto_reruns: 3
          auto_rerun_delay: 15s
      - save-gradle-cache

  workflow-rerun:
    executor: docker-executor
    steps:
      - checkout
      - restore-gradle-cache
      - run:
          command: ./gradlew run --args="workflowRerun"
      - save-gradle-cache

workflows:
  debug:
    jobs:
      - debug-all-variables

  build-and-test-machine:
    jobs:
      - build:
          executor: machine-executor
      - test:
          executor: machine-executor
          requires:
            - build

  build-and-test-docker:
    jobs:
      - build:
          executor: docker-executor
      - test:
          executor: docker-executor
          requires:
            - build

  full-checkout:
    jobs:
      - just-checkout

  blobless-checkout:
    jobs:
      - just-checkout:
          checkout-method: blobless

  with-step-rerun:
    jobs:
      - step-rerun

  with-workflow-rerun:
    max_auto_reruns: 5
    jobs:
      - workflow-rerun
