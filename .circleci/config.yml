version: 2.1

commands:
  restore-gradle-cache:
    steps:
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-

  save-gradle-cache:
    steps:
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

jobs:
  build:
    parameters:
      checkout-method:
        type: string
        default: full
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout:
          method: << parameters.checkout-method >>
      - restore-gradle-cache
      - run: ./gradlew build -x test
      - save-gradle-cache
    retention:
      caches: 1d

  test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore-gradle-cache
      - run: ./gradlew test --rerun
      - store_test_results:
          path: build/test-results
      - save-gradle-cache

  test-parallel:
    docker:
      - image: cimg/openjdk:21.0
    parallelism: 2
    steps:
      - checkout
      - restore-gradle-cache
      - run:
          name: Run tests in parallel (split by name)
          command: |
            # Get all test files and split by name
            TESTFILES=$(circleci tests glob "**/src/test/**/*Test.java" | circleci tests split --split-by=name)

            # Convert file paths to test class names
            CLASSNAMES=$(echo "$TESTFILES" | sed 's|src/test/java/||g' | sed 's|\.java||g' | sed 's|/|.|g')

            # Build Gradle test arguments
            GRADLE_ARGS=$(echo "$CLASSNAMES" | sed 's/^/--tests /' | tr '\n' ' ')

            # Run the tests
            ./gradlew test $GRADLE_ARGS
      - store_test_results:
          path: build/test-results
      - save-gradle-cache


  step-rerun:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore-gradle-cache
      - run:
          command: ./gradlew run --args="rerun"
          max_auto_reruns: 3
          auto_rerun_delay: 15s
      - save-gradle-cache

  workflow-rerun:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore-gradle-cache
      - run:
          command: ./gradlew run --args="workflowRerun"
      - save-gradle-cache

workflows:
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build
      - test-parallel:
          requires:
            - build

  full-checkout:
    jobs:
      - build

  blobless-checkout:
    jobs:
      - build:
          checkout-method: blobless

  with-step-rerun:
    jobs:
      - step-rerun

  with-workflow-rerun:
    max_auto_reruns: 5
    jobs:
      - workflow-rerun